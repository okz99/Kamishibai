</style></head><body><main class="app"><section class="panel left-body"><h1>シナリオ動画風プレイヤー</h1><details id="settings"><summary>設定（シナリオ登録・登場人物・音声）</summary><div class="inside"><h2>シナリオを選択・保存</h2><div class="savebar"><select id="scenarioSelect" aria-label="保存したシナリオ"><option value="">新規シナリオ</option></select><button id="newBtn" class="secondary">新規</button></div><div class="field"><label for="titleInput">シナリオ名</label><input id="titleInput" type="text" placeholder="第2席 ベジータと失われた故郷の巻"></div><div class="buttons"><button id="saveBtn">保存・上書き</button><button id="saveAsBtn" class="secondary">別名で保存</button><button id="deleteBtn" class="danger">削除</button></div><div class="hint">シナリオはこのブラウザ内に保存されます。別の端末やブラウザには自動で同期されません。</div><div class="field"><label for="scenarioInput">シナリオ本文</label><textarea id="scenarioInput" placeholder="亀仙人国連「さて、今日は……」&#10;孫悟空日本「おう！」"></textarea></div><div class="buttons"><button id="parseBtn" class="secondary">登場人物を抽出・反映</button></div><h2 style="margin-top:18px">登場人物の画像・声・高さ・速さ</h2><div class="hint">登場人物ごとに画像と音声を設定できます。設定はブラウザに自動保存され、別のシナリオでも同じ名前の人物に適用されます。利用できる声の種類は端末・ブラウザによって異なります。</div><div id="characters"></div><div class="field"><label for="gapInput">セリフ間隔（ミリ秒）</label><input id="gapInput" type="number" min="0" max="10000" step="100" value="400"></div><div class="field"><label for="narrationVoice">ナレーションの声</label><select id="narrationVoice"></select></div></div></details></section>
<section class="panel"><div class="buttons"><button id="playBtn">▶ 再生</button><button id="pauseBtn" class="secondary">一時停止</button><button id="prevBtn" class="secondary" title="長押しで連続戻し">◀ 前へ</button><button id="nextBtn" class="secondary" title="長押しで早送り">次へ ▶</button><button id="stopBtn" class="danger">■ 停止</button></div><div class="stage" id="stage"><div class="top-label"><span id="stageTitle">シナリオ動画風プレイヤー</span><span id="counter">0 / 0</span></div><div class="figure"><div class="placeholder" id="placeholder">♟</div><img id="stageImage" alt="" hidden></div><div class="speech"><div class="speaker" id="speaker">待機中</div><div class="bubble" id="bubble">シナリオを入力し、再生してください。</div></div></div><div id="status" class="status" role="status">準備完了（「前へ」「次へ」は長押しで連続移動できます）</div><div id="currentLine" class="line"></div></section></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), SCENARIO_KEY='scenario_movie_scenarios_v2',CHAR_KEY='scenario_movie_characters_v2',UI_KEY='scenario_movie_ui_v2';
const sample='【第一幕　天下一武道会の土地争い】\n亀仙人国連「さて、前回はベジータイスラエルとピッコロイランの喧嘩について話したのう。今日は、その喧嘩の根っこにあるパレスチナ問題について話そう。」\n孫悟空日本「おう！　ところでじっちゃん、パレスチナって国なのか？」\n孫悟飯パレスチナ「こんにちは、お父さん。」\nベジータイスラエル「フン！　その土地は俺たちにとっても大切な故郷なのだ！」';
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
let scenarios=read(SCENARIO_KEY,[]), characters=read(CHAR_KEY,{}),ui=read(UI_KEY,{}),lines=[],index=0,playing=false,paused=false,timer=null,token=0,voices=[],selectedId=null;
const status=t=>$('status').textContent=t;const persist=(key,data)=>{try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){status('保存に失敗しました。ブラウザの保存容量またはプライベートモードを確認してください。');return false}};
const escapeText=t=>String(t??'');
function parse(text){const result=[];for(const raw of String(text).replace(/\r/g,'').split('\n')){const s=raw.trim();if(!s)continue;const m=s.match(/^(.+?)「([\s\S]*)」\s*$/);if(m){result.push({speaker:m[1].trim(),text:m[2],raw:s,type:'speech'});}else{result.push({speaker:'ナレーション',text:s,raw:s,type:'narration'});}}return result;}
function names(){return [...new Set(lines.filter(x=>x.type==='speech').map(x=>x.speaker))]}
function persistChars(){persist(CHAR_KEY,characters)}
function voiceOptions(select,value){select.replaceChildren();const defaultOpt=new Option('端末の標準音声','');select.add(defaultOpt);voices.forEach(v=>select.add(new Option(`${v.name}（${v.lang}）`,v.voiceURI)));select.value=value||'';if(select.value!==(value||'')){select.value='';}}
function updateVoices(){if(!('speechSynthesis' in window))return;voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));voiceOptions($('narrationVoice'),ui.narrationVoice);document.querySelectorAll('[data-voice-person]').forEach(el=>voiceOptions(el,characters[el.dataset.voicePerson]?.voice));}
function buildCharacters(){const root=$('characters');root.replaceChildren();for(const name of names()){
 const cfg=characters[name]??(characters[name]={voice:'',pitch:1,rate:1});const block=document.createElement('div');block.className='character';
 const head=document.createElement('div');head.className='character-head';const img=document.createElement('img');img.className='avatar';img.alt=name;img.src=cfg.image||svgAvatar(name);const label=document.createElement('div');const strong=document.createElement('div');strong.className='character-name';strong.textContent=name;label.append(strong);head.append(img,label);block.append(head);
 const file=document.createElement('input');file.type='file';file.accept='image/*';file.setAttribute('aria-label',`${name}の画像`);file.addEventListener('change',()=>{const f=file.files?.[0];if(!f)return;if(f.size>4*1024*1024){status('画像が大きすぎます。4MB以下の画像を選択してください。');return;}const reader=new FileReader();reader.onload=()=>{const before=cfg.image;cfg.image=String(reader.result);if(!persist(CHAR_KEY,characters)){cfg.image=before;return;}img.src=cfg.image;removeImage.disabled=false;render();status(`${name} の画像を登録しました。`);};reader.readAsDataURL(f);});
 const imageActions=document.createElement('div');imageActions.className='image-actions';const removeImage=document.createElement('button');removeImage.type='button';removeImage.className='danger';removeImage.textContent='画像を削除';removeImage.disabled=!cfg.image;file.addEventListener('change',()=>{if(file.files?.length)removeImage.disabled=false});removeImage.addEventListener('click',()=>{if(!cfg.image)return;const old=cfg.image;delete cfg.image;if(!persist(CHAR_KEY,characters)){cfg.image=old;return;}img.src=svgAvatar(name);file.value='';removeImage.disabled=true;render();status(`${name} の画像を削除しました。`)});imageActions.append(file,removeImage);block.append(imageActions);
 const grid=document.createElement('div');grid.className='settings-grid';const voiceWrap=document.createElement('label');voiceWrap.textContent='声の種類';const voice=document.createElement('select');voice.dataset.voicePerson=name;voiceOptions(voice,cfg.voice);voice.addEventListener('change',()=>{cfg.voice=voice.value;persistChars()});voiceWrap.append(voice);voiceWrap.style.gridColumn='1 / -1';grid.append(voiceWrap);
 for(const [key,title,min,max] of [['pitch','声の高さ',0.5,2],['rate','読み上げ速度',0.5,2]]){const wrap=document.createElement('label');const value=document.createElement('span');value.className='range-value';value.textContent=` ${Number(cfg[key]??1).toFixed(1)}`;wrap.append(document.createTextNode(title),value);const input=document.createElement('input');input.type='range';input.min=String(min);input.max=String(max);input.step='0.1';input.value=String(cfg[key]??1);input.addEventListener('input',()=>{cfg[key]=Number(input.value);value.textContent=' '+cfg[key].toFixed(1);persistChars()});wrap.append(input);grid.append(wrap);}block.append(grid);root.append(block);
 }if(!names().length){const empty=document.createElement('p');empty.className='hint';empty.textContent='シナリオを入力して「登場人物を抽出・反映」を押してください。';root.append(empty);}persistChars();}
function svgAvatar(name){const s=name.slice(0,2).replace(/[<>&"']/g,'');return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#dbe4f1"/><text x="50" y="57" font-size="28" text-anchor="middle" fill="#54657b">${s}</text></svg>`)}
function render(){const l=lines[index];$('counter').textContent=lines.length?`${index+1} / ${lines.length}`:'0 / 0';$('stageTitle').textContent=$('titleInput').value.trim()||'シナリオ動画風プレイヤー';if(!l){$('speaker').textContent='待機中';$('bubble').textContent='シナリオを入力し、再生してください。';$('currentLine').textContent='';return;}$('speaker').textContent=l.speaker;$('bubble').textContent=l.text;$('currentLine').textContent=l.raw;$('stage').classList.toggle('narration',l.type==='narration');const picture=characters[l.speaker]?.image;$('stageImage').hidden=!picture;$('placeholder').hidden=!!picture;if(picture)$('stageImage').src=picture;}
function prepare(){stop(false);lines=parse($('scenarioInput').value);index=0;buildCharacters();render();status(`解析完了：${lines.length} 行、登場人物 ${names().length} 人。`)}
function clearTimer(){if(timer!==null){clearTimeout(timer);timer=null}}
function stop(show=true){token++;playing=false;paused=false;clearTimer();if('speechSynthesis' in window)speechSynthesis.cancel();$('pauseBtn').textContent='一時停止';if(show)status('停止しました。')}
function chooseVoice(uri){return voices.find(v=>v.voiceURI===uri)||null}
function nextSpeech(){if(!playing||paused)return;if(index>=lines.length){stop(false);status('最後まで再生しました。');return;}render();const l=lines[index];const seq=++token;let text=l.text;const cfg=characters[l.speaker]||{};const utter=new SpeechSynthesisUtterance(text);utter.lang='ja-JP';utter.rate=l.type==='narration'?1:Number(cfg.rate??1);utter.pitch=l.type==='narration'?1:Number(cfg.pitch??1);const v=chooseVoice(l.type==='narration'?ui.narrationVoice:cfg.voice);if(v)utter.voice=v;
 utter.onend=()=>{if(seq!==token||!playing)return;const gap=Math.min(10000,Math.max(0,Number($('gapInput').value)||0));timer=setTimeout(()=>{if(seq!==token||!playing)return;index++;nextSpeech()},gap)};utter.onerror=e=>{if(seq!==token||!playing)return;if(e.error==='canceled'||e.error==='interrupted')return;stop(false);status(`読み上げエラー：${e.error}。利用可能な音声を設定してください。`)};
 speechSynthesis.speak(utter);status(`再生中：${l.speaker}（${index+1}/${lines.length}）`);
}
function play(){if(!('speechSynthesis' in window)){status('このブラウザは音声読み上げに対応していません。');return;}if(playing&&paused){speechSynthesis.resume();paused=false;$('pauseBtn').textContent='一時停止';status('再生を再開しました。');return;}if(playing){stop(false);}if(!lines.length||lines.map(l=>l.raw).join('\n')!==parse($('scenarioInput').value).map(l=>l.raw).join('\n')){prepare();}if(!lines.length){status('シナリオを入力してください。');return;}if(index>=lines.length)index=0;playing=true;paused=false;nextSpeech();}
function move(delta){if(!lines.length)return;stop(false);index=Math.max(0,Math.min(lines.length-1,index+delta));render();status(`${index+1} 行目を表示しています。`)}
// 前へ・次へを長押しすると、一定間隔でセリフを連続移動する。
function setupHoldNavigation(buttonId,delta){
 const button=$(buttonId);
 let delayTimer=null,repeatTimer=null,holding=false,ignoreClick=false,activePointer=null;
 const clearHold=()=>{
  if(delayTimer!==null){clearTimeout(delayTimer);delayTimer=null;}
  if(repeatTimer!==null){clearInterval(repeatTimer);repeatTimer=null;}
  holding=false;activePointer=null;
 };
 button.addEventListener('pointerdown',e=>{
  if(e.button!==0||activePointer!==null)return;
  clearHold();ignoreClick=false;activePointer=e.pointerId;
  delayTimer=setTimeout(()=>{
   delayTimer=null;holding=true;ignoreClick=true;
   move(delta);
   repeatTimer=setInterval(()=>move(delta),110);
  },450);
 });
 button.addEventListener('pointerup',e=>{if(activePointer===e.pointerId)clearHold();});
 button.addEventListener('pointercancel',clearHold);
 button.addEventListener('lostpointercapture',clearHold);
 button.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')clearHold();});
 button.addEventListener('click',e=>{
  if(ignoreClick){e.preventDefault();ignoreClick=false;return;}
  move(delta);
 });
 // キーボードでは、通常のクリック操作として1行ずつ移動する。
 button.addEventListener('blur',clearHold);
}
function refreshSaved(){const select=$('scenarioSelect'),value=selectedId||'';select.replaceChildren(new Option('新規シナリオ',''));for(const s of scenarios){select.add(new Option(s.title,s.id));}select.value=value;if(select.value!==value)select.value='';}
function loadSaved(id){stop(false);const s=scenarios.find(s=>s.id===id);selectedId=s?id:null;$('titleInput').value=s?.title||'';$('scenarioInput').value=s?.text||'';refreshSaved();prepare()}
function save(asNew=false){const title=$('titleInput').value.trim();if(!title){status('シナリオ名を入力してください。');$('titleInput').focus();return;}let id=asNew?null:selectedId;if(!id)id=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2);const record={id,title,text:$('scenarioInput').value,updated:Date.now()};const i=scenarios.findIndex(s=>s.id===id);if(i>=0)scenarios[i]=record;else scenarios.push(record);if(!persist(SCENARIO_KEY,scenarios))return;selectedId=id;refreshSaved();render();status('シナリオをブラウザに保存しました。')}
$('parseBtn').onclick=prepare;$('playBtn').onclick=play;$('stopBtn').onclick=()=>stop(true);setupHoldNavigation('nextBtn',1);setupHoldNavigation('prevBtn',-1);$('pauseBtn').onclick=()=>{if(!playing)return;if(paused){speechSynthesis.resume();paused=false;$('pauseBtn').textContent='一時停止';status('再生中');}else{speechSynthesis.pause();paused=true;$('pauseBtn').textContent='再開';status('一時停止中');}};
$('saveBtn').onclick=()=>save(false);$('saveAsBtn').onclick=()=>save(true);$('newBtn').onclick=()=>loadSaved(null);$('scenarioSelect').onchange=e=>loadSaved(e.target.value);$('deleteBtn').onclick=()=>{if(!selectedId){status('削除する保存済みシナリオを選択してください。');return;}if(!confirm('選択中のシナリオを削除しますか？'))return;scenarios=scenarios.filter(s=>s.id!==selectedId);if(persist(SCENARIO_KEY,scenarios)){loadSaved(null);status('シナリオを削除しました。')}};
$('narrationVoice').addEventListener('change',e=>{ui.narrationVoice=e.target.value;persist(UI_KEY,ui)});$('gapInput').value=String(ui.gap??400);$('gapInput').addEventListener('change',e=>{ui.gap=Number(e.target.value);persist(UI_KEY,ui)});
$('scenarioInput').addEventListener('input',()=>{if(playing)stop(false)});$('titleInput').addEventListener('input',render);
if('speechSynthesis' in window){updateVoices();speechSynthesis.addEventListener?.('voiceschanged',updateVoices)}
refreshSaved();if(scenarios.length)loadSaved(scenarios[0].id);else{$('titleInput').value='第2席 ベジータと失われた故郷の巻';$('scenarioInput').value=sample;prepare();}
})();
</script></body></html>
